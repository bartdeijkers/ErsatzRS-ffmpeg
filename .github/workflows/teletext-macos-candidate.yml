name: Build macOS teletext candidates

# Explicit candidate construction only. No tag, release or container publishing.
# Both native architectures remain required for Phase 9 acceptance.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unpublished candidate version; do not reuse an immutable release'
        required: true
        default: '2.0.7-teletext-candidate'
        type: string
      rid:
        description: 'Build both required candidates, or retry one failed architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - osx-x64
          - osx-arm64
      homebrew_core_revision:
        description: 'Exact 40-character Homebrew/core source revision'
        required: true
        default: '84c454b4e56ff7f076cabc90ff58e0d0de01fab1'
        type: string
      homebrew_brew_revision:
        description: 'Exact compatible 40-character Homebrew/brew source revision'
        required: true
        default: '8f10429b56be28a25032b87463fffc95e556b5bc'
        type: string
      homebrew_cask_revision:
        description: 'Exact compatible 40-character Homebrew/cask migration revision'
        required: true
        default: 'd4d25dbd93eef9ed20f4ae73f3c269a728a412eb'
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Native ${{ matrix.rid }} candidate
    runs-on: ${{ matrix.runner }}
    # Intel has no current Homebrew bottles and must compile the LLVM/Rust
    # dependency chain. Keep the shorter bound for the bottled ARM64 path.
    timeout-minutes: ${{ matrix.rid == 'osx-x64' && 360 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # A targeted retry reuses the other architecture's valid evidence;
        # the default matrix still requires both native candidates.
        include: >-
          ${{ fromJSON(
            inputs.rid == 'osx-x64' && '[{"rid":"osx-x64","runner":"macos-15-intel"}]' ||
            inputs.rid == 'osx-arm64' && '[{"rid":"osx-arm64","runner":"macos-15"}]' ||
            '[{"rid":"osx-x64","runner":"macos-15-intel"},{"rid":"osx-arm64","runner":"macos-15"}]'
          ) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    steps:
      - name: Checkout build and verification inputs
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact dependency recipes on this ephemeral runner
        env:
          CORE_REVISION: ${{ inputs.homebrew_core_revision }}
          BREW_REVISION: ${{ inputs.homebrew_brew_revision }}
          CASK_REVISION: ${{ inputs.homebrew_cask_revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BREW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CASK_REVISION" =~ ^[0-9a-f]{40}$ ]]
          # The pinned recipes use the Homebrew 7 test-resource DSL, while
          # hosted images can still ship Homebrew 6. Pin the compatible tool too.
          brew_repository="$(brew --repository)"
          git -C "$brew_repository" fetch --depth=1 origin "$BREW_REVISION"
          git -C "$brew_repository" checkout --detach --force FETCH_HEAD
          test "$(git -C "$brew_repository" rev-parse HEAD)" = "$BREW_REVISION"
          brew --version
          brew tap --force homebrew/core
          core="$(brew --repository homebrew/core)"
          git -C "$core" fetch --depth=1 origin "$CORE_REVISION"
          # Hosted images may carry formula overrides; this ephemeral tap must
          # match the reviewed revision rather than the runner image's edits.
          git -C "$core" checkout --detach --force FETCH_HEAD
          test "$(git -C "$core" rev-parse HEAD)" = "$CORE_REVISION"
          # Core's Azure CLI migration must not cycle through an older runner
          # Cask migration back to core. No casks are installed by this recipe.
          brew tap --force homebrew/cask
          cask="$(brew --repository homebrew/cask)"
          git -C "$cask" fetch --depth=1 origin "$CASK_REVISION"
          git -C "$cask" checkout --detach --force FETCH_HEAD
          test "$(git -C "$cask" rev-parse HEAD)" = "$CASK_REVISION"
          brew install pkgconf nasm autoconf automake libtool gettext dylibbundler \
            cairo librsvg fontconfig freetype harfbuzz fribidi libass zimg svt-av1 \
            jpeg-xl x264 x265 libvpx opus openssl@3 rav1e dav1d
          brew upgrade pkgconf nasm autoconf automake libtool gettext dylibbundler \
            cairo librsvg fontconfig freetype harfbuzz fribidi libass zimg svt-av1 \
            jpeg-xl x264 x265 libvpx opus openssl@3 rav1e dav1d
      - name: Check source and process-bound regressions
        shell: bash
        run: python3 scripts/test-teletext-tools.py
      - name: Build, relocate and execute the native candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
          CORE_REVISION: ${{ inputs.homebrew_core_revision }}
          BREW_REVISION: ${{ inputs.homebrew_brew_revision }}
          CASK_REVISION: ${{ inputs.homebrew_cask_revision }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/teletext-macos-$RID"
          echo "CANDIDATE_WORK=$work" >> "$GITHUB_ENV"
          python3 recipes/macos/build.py --rid "$RID" --version "$CANDIDATE_VERSION" \
            --work "$work" --jobs 3 --homebrew-core-revision "$CORE_REVISION" \
            --homebrew-brew-revision "$BREW_REVISION" \
            --homebrew-cask-revision "$CASK_REVISION" \
            2>&1 | tee "$RUNNER_TEMP/teletext-macos-$RID.log"
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teletext-candidate-${{ matrix.rid }}
          path: |
            ${{ env.CANDIDATE_WORK }}/ersatzrs-ffmpeg-*.tar.gz*
            ${{ env.CANDIDATE_WORK }}/ersatzrs-ffmpeg-*/build-info/
            ${{ runner.temp }}/teletext-macos-${{ matrix.rid }}.log
          if-no-files-found: warn
