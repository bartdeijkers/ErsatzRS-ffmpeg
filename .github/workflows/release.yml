name: Release

# Release-driven build, mirroring the ErsatzRS ci.yml + release.yml split:
# multi-platform.yml is the continuous (push-to-main) Docker CI, while this
# workflow produces the per-RID FFmpeg packages that ErsatzRS downloads at
# startup (ADR-0008) and attaches them to the GitHub Release for the tag.
#
# Scoped to two RIDs only: linux-x64 and win-x64. arm64/arm-v7/osx packages are
# future work. NOTE: the arm Docker images (images/linux/arm*) are fine — they
# bundle only self-built codec libs (ldd | awk '/local/'), not glibc. But when
# arm RIDs are added as downloadable release *packages* they MUST be static
# (never extract the full ldd closure the old linux-x64 way, which bundled
# libc.so.6 and broke on older host glibc). linux-arm64: BtbN has a `linuxarm64`
# target — mirror the linux-x64 job. linux-arm (armv7): BtbN has no 32-bit arm
# target, so it needs a separate static cross-build.
#
# Runs on the self-hosted Linux release runner. Both linux-x64 and win-x64 are
# built with BtbN/FFmpeg-Builds (Docker) — see images/ffmpeg-builds/. win-x64 is
# fully static. linux-x64 statically links every codec but links glibc
# dynamically (BtbN has no fully-static linux target); crucially it bundles no
# shared libraries, so it runs against the host's own glibc — eliminating the
# bundled-libc / host-loader mismatch of the earlier ldd-closure packaging. The
# linux repackage step then smoke-tests the binaries on debian:bookworm-slim
# (the ErsatzRS runtime baseline) to guarantee they run there. The Windows
# self-hosted Windows runner validates the uploaded win-x64 artifact before a
# tagged release may publish; package construction still happens on Linux.
#   linux-x64 -> [self-hosted, ersatzrs-linux-release]
#   win-x64   -> [self-hosted, ersatzrs-linux-release]
#   win verify -> [self-hosted, ersatzrs-windows-release]

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.0). Dispatch builds the packages but does not publish a release.'
        required: true
      target:
        description: 'Package target to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-x64
          - win-x64

env:
  # Upstream FFmpeg version these packages contain (independent of the repo
  # release tag, which is the v*.*.* git tag).
  FFMPEG_VERSION: '9.0'

jobs:
  linux-x64:
    name: Build linux-x64 package
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-x64' }}
    runs-on: [self-hosted, ersatzrs-linux-release]
    # No registry login / image push here: the ghcr ersatzrs-ffmpeg image is
    # built and pushed by multi-platform.yml. This job only produces the static
    # linux-x64 release package (symmetric with win-x64).
    env:
      # Pinned FFmpeg-Builds commit (keep in lock-step with the win-x64 job;
      # see images/ffmpeg-builds/README.md).
      FFBUILDS_REF: d04d5526084bb699ca2b400c32bbab7eb3ebcb4e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Build linux-x64 FFmpeg via BtbN FFmpeg-Builds
        # Mirror the win-x64 job's toolchain. BtbN linux64 statically links every
        # codec but links glibc dynamically (there is no fully-static linux64
        # target), so the package bundles NO shared libraries and runs against
        # the host's own glibc. That is what fixes the original bug: the previous
        # approach copied ffmpeg's whole ldd closure (including libc.so.6) out of
        # the runtime image and relied on LD_LIBRARY_PATH=<dir>/lib, which loads
        # the build's libc under the *host's* dynamic loader, so a host glibc
        # older than the build's fails with `libc.so.6: undefined symbol
        # __tunable_is_initialized, version GLIBC_PRIVATE`. Bundling nothing
        # removes that coupling; the repackage step then verifies the binaries
        # run on our glibc baseline. Our cairo/pixman overrides (which upstream
        # lacks) are dropped into scripts.d/ first, and cairo is registered in
        # the build graph (see below) — identical to win-x64.
        env:
          WORK: ${{ runner.temp }}/ffmpeg-builds-linux
          FFTAG: n${{ env.FFMPEG_VERSION }}
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          git clone https://github.com/BtbN/FFmpeg-Builds.git "$WORK"
          git -C "$WORK" -c advice.detachedHead=false checkout "$FFBUILDS_REF"
          cp "$GITHUB_WORKSPACE"/images/ffmpeg-builds/scripts.d/*.sh "$WORK/scripts.d/"
          # Register cairo in the build graph. BtbN's entry stage (zz-final.sh)
          # hard-codes the dependency list that gets built; without this our
          # cairo/pixman scripts are copied in but never reached, so
          # --enable-cairo silently drops out. pixman follows as cairo's dep.
          grep -q 'echo cairo' "$WORK/scripts.d/zz-final.sh" \
            || sed -i 's/^\( *\)echo rpath$/\1echo cairo\n\1echo rpath/' "$WORK/scripts.d/zz-final.sh"
          grep -q 'echo cairo' "$WORK/scripts.d/zz-final.sh"  # fail loudly if the anchor moved
          cd "$WORK"
          python3 "$GITHUB_WORKSPACE/images/ffmpeg-builds/prepare-patches.py" "$WORK" linux64
          ./makeimage.sh linux64 gpl 9.0
          svg_image="ersatzrs-ffmpeg-svg:linux64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_image="ghcr.io/${GITHUB_REPOSITORY,,}/linux64-gpl-9.0:latest"
          docker build --build-arg BASE_IMAGE="$base_image" --build-arg FFBUILD_JOBS=8 \
            -t "$svg_image" "$GITHUB_WORKSPACE/images/ffmpeg-builds/svg"
          svg_image_id="$(docker image inspect --format '{{.Id}}' "$svg_image")"
          # BuildKit resolves FROM as an image name, not a bare local image ID.
          pinned_base="ersatzrs-ffmpeg-build-base:${svg_image_id#sha256:}"
          docker tag "$svg_image_id" "$pinned_base"
          test "$(docker image inspect --format '{{.Id}}' "$pinned_base")" = "$svg_image_id"
          qsv_image="${svg_image}-qsv"
          docker build --build-arg BASE_IMAGE="$pinned_base" \
            -f "$GITHUB_WORKSPACE/images/ffmpeg-builds/onevpl/Dockerfile" \
            -t "$qsv_image" "$GITHUB_WORKSPACE/images/ffmpeg-builds"
          image_id="$(docker image inspect --format '{{.Id}}' "$qsv_image")"
          printf '%s\n' "$image_id" > "$WORK/svg-image-id.txt"
          docker run --rm --network none --entrypoint tar "$image_id" \
            -C /opt -cf - ersatzrs-svg-sources > "$WORK/svg-sources.tar"
          FFBUILD_IMAGE_OVERRIDE="$image_id" GIT_BRANCH_OVERRIDE="$FFTAG" ./build.sh linux64 gpl 9.0

      - name: Repackage to ErsatzRS layout
        # BtbN emits <build-name>/bin/{ffmpeg,ffprobe} inside a .tar.xz; ErsatzRS
        # expects the executables at the top of
        # ersatzrs-ffmpeg-<version>-linux-x64/. The build bundles no shared
        # libraries (codecs are static; glibc is the host's), so there is no
        # lib/ directory and ErsatzRS runs the executables directly (no
        # LD_LIBRARY_PATH launcher wrapper).
        env:
          WORK: ${{ runner.temp }}/ffmpeg-builds-linux
          OUTDIR: ${{ runner.temp }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          src_archive="$(ls "$WORK"/artifacts/*linux64-gpl*.tar.xz | head -n1)"
          tmp="$(mktemp -d)"
          tar -C "$tmp" -xf "$src_archive"
          dest="ersatzrs-ffmpeg-${VERSION}-linux-x64"
          rm -rf "${OUTDIR:?}/$dest" && mkdir -p "$OUTDIR/$dest"
          mkdir -p "$OUTDIR/$dest/build-info"
          tar -xf "$WORK/svg-sources.tar" -C "$OUTDIR/$dest/build-info"
          cp "$WORK/svg-image-id.txt" "$OUTDIR/$dest/build-info/"
          ( cd "$WORK/ersatzrs-patches" && sha256sum *.patch ) \
            > "$OUTDIR/$dest/build-info/patches.sha256"
          find "$tmp" -type f -name ffmpeg  -exec cp {} "$OUTDIR/$dest/" \;
          find "$tmp" -type f -name ffprobe -exec cp {} "$OUTDIR/$dest/" \;
          find "$tmp" -iname 'LICENSE*'     -exec cp {} "$OUTDIR/$dest/" \;
          chmod +x "$OUTDIR/$dest/ffmpeg" "$OUTDIR/$dest/ffprobe"
          test -f "$OUTDIR/$dest/ffmpeg" && test -f "$OUTDIR/$dest/ffprobe"
          # Portability gate. BtbN linux64 statically links every codec but links
          # glibc dynamically, so the package bundles no shared libraries and runs
          # against the host's own glibc — there is no bundled-libc / host-loader
          # mismatch (the bug this release fixed). The remaining requirement is a
          # recent-enough host glibc. ErsatzRS ships on debian:bookworm-slim
          # (glibc 2.36) and downloads this package onto arbitrary hosts, so prove
          # the binaries actually execute on that clean baseline. This catches a
          # glibc bump in the BtbN toolchain that would otherwise only surface at
          # user runtime as `GLIBC_2.xx not found`. (bookworm-slim ships libc6 and
          # libgcc-s1, the only non-static deps; a missing one fails here loudly.)
          # Also assert the requested upstream version and ErsatzRS graphics
          # runtime contract so a successful build cannot publish the wrong tag
          # or silently omit drawvg, drawtext, or text shaping support.
          for tool in ffmpeg ffprobe; do
            version_output="$(docker run --rm -v "$OUTDIR/$dest:/pkg:ro" \
              debian:bookworm-slim "/pkg/$tool" -version)"
            printf '%s\n' "$version_output"
            first_line="${version_output%%$'\n'*}"
            [[ "$first_line" == "$tool version n${FFMPEG_VERSION}"* ]]
          done
          filters="$(docker run --rm -v "$OUTDIR/$dest:/pkg:ro" \
            debian:bookworm-slim /pkg/ffmpeg -hide_banner -filters)"
          grep -Eq '(^|[[:space:]])drawvg[[:space:]]' <<< "$filters"
          grep -Eq '(^|[[:space:]])drawtext[[:space:]]' <<< "$filters"
          buildconf="$(docker run --rm -v "$OUTDIR/$dest:/pkg:ro" \
            debian:bookworm-slim /pkg/ffmpeg -hide_banner -buildconf)"
          for flag in --enable-librsvg --enable-cairo --enable-fontconfig --enable-libfreetype --enable-libharfbuzz --enable-libfribidi; do
            grep -Fq -- "$flag" <<< "$buildconf"
          done
          printf '%s' 'ErsatzRS' > "$OUTDIR/$dest/drawtext-proof.txt"
          docker run --rm -v "$OUTDIR/$dest:/pkg:ro" debian:bookworm-slim \
            sh -ec "apt-get update -qq && apt-get install -yqq --no-install-recommends fonts-dejavu-core >/dev/null && \
              /pkg/ffmpeg -hide_banner -loglevel error \
              -f lavfi -i color=c=black:s=64x64:d=0.1 \
              -vf 'drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=/pkg/drawtext-proof.txt:reload=1:fontsize=16:x=4:y=4,format=yuv420p' \
              -frames:v 1 -f null -"
          rm "$OUTDIR/$dest/drawtext-proof.txt"
          python3 "$GITHUB_WORKSPACE/scripts/verify-svg.py" "$OUTDIR/$dest/ffmpeg"
          pkg="${dest}.tar.gz"
          tar -C "$OUTDIR" -czf "$OUTDIR/$pkg" "$dest"
          ( cd "$OUTDIR" && sha256sum "$pkg" > "$pkg.sha256" )
          rm -rf "$tmp" "$OUTDIR/$dest"

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/ersatzrs-ffmpeg-*-linux-x64.tar.gz*
          if-no-files-found: error

  win-x64:
    name: Build win-x64 package
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'win-x64' }}
    # Statically cross-compiled with BtbN/FFmpeg-Builds (Docker) so the package
    # ships two self-contained executables instead of a thin .exe + DLL closure.
    # Runs on the Linux release runner (Docker), not the Windows runner.
    runs-on: [self-hosted, ersatzrs-linux-release]
    env:
      # Pinned FFmpeg-Builds commit (bump deliberately, in lock-step with the
      # linux-x64 job; see images/ffmpeg-builds/README.md).
      FFBUILDS_REF: d04d5526084bb699ca2b400c32bbab7eb3ebcb4e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Build static win-x64 FFmpeg via BtbN FFmpeg-Builds
        # makeimage.sh builds the cross toolchain + every dependency into a
        # Docker image; build.sh then statically links FFmpeg against them.
        # The `9.0` addin sets FFmpeg version gating; GIT_BRANCH_OVERRIDE pins
        # the exact upstream release tag (n9.0). Our cairo/pixman overrides
        # (which upstream lacks) are dropped into scripts.d/ first, and cairo is
        # registered in the build graph (see below).
        env:
          WORK: ${{ runner.temp }}/ffmpeg-builds
          FFTAG: n${{ env.FFMPEG_VERSION }}
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          git clone https://github.com/BtbN/FFmpeg-Builds.git "$WORK"
          git -C "$WORK" -c advice.detachedHead=false checkout "$FFBUILDS_REF"
          cp "$GITHUB_WORKSPACE"/images/ffmpeg-builds/scripts.d/*.sh "$WORK/scripts.d/"
          # Register cairo in the build graph. BtbN's entry stage (zz-final.sh)
          # hard-codes the dependency list that gets built; without this our
          # cairo/pixman scripts are copied in but never reached, so
          # --enable-cairo silently drops out. pixman follows as cairo's dep.
          grep -q 'echo cairo' "$WORK/scripts.d/zz-final.sh" \
            || sed -i 's/^\( *\)echo rpath$/\1echo cairo\n\1echo rpath/' "$WORK/scripts.d/zz-final.sh"
          grep -q 'echo cairo' "$WORK/scripts.d/zz-final.sh"  # fail loudly if the anchor moved
          cd "$WORK"
          python3 "$GITHUB_WORKSPACE/images/ffmpeg-builds/prepare-patches.py" "$WORK" win64
          ./makeimage.sh win64 gpl 9.0
          svg_image="ersatzrs-ffmpeg-svg:win64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_image="ghcr.io/${GITHUB_REPOSITORY,,}/win64-gpl-9.0:latest"
          docker build --build-arg BASE_IMAGE="$base_image" --build-arg FFBUILD_JOBS=8 \
            -t "$svg_image" "$GITHUB_WORKSPACE/images/ffmpeg-builds/svg"
          svg_image_id="$(docker image inspect --format '{{.Id}}' "$svg_image")"
          # BuildKit resolves FROM as an image name, not a bare local image ID.
          pinned_base="ersatzrs-ffmpeg-build-base:${svg_image_id#sha256:}"
          docker tag "$svg_image_id" "$pinned_base"
          test "$(docker image inspect --format '{{.Id}}' "$pinned_base")" = "$svg_image_id"
          qsv_image="${svg_image}-qsv"
          docker build --build-arg BASE_IMAGE="$pinned_base" \
            -f "$GITHUB_WORKSPACE/images/ffmpeg-builds/onevpl/Dockerfile" \
            -t "$qsv_image" "$GITHUB_WORKSPACE/images/ffmpeg-builds"
          image_id="$(docker image inspect --format '{{.Id}}' "$qsv_image")"
          printf '%s\n' "$image_id" > "$WORK/svg-image-id.txt"
          docker run --rm --network none --entrypoint tar "$image_id" \
            -C /opt -cf - ersatzrs-svg-sources > "$WORK/svg-sources.tar"
          FFBUILD_IMAGE_OVERRIDE="$image_id" GIT_BRANCH_OVERRIDE="$FFTAG" ./build.sh win64 gpl 9.0

      - name: Repackage to ErsatzRS layout
        # BtbN emits <build-name>/bin/{ffmpeg,ffprobe}.exe; ErsatzRS expects the
        # exes at the top of ersatzrs-ffmpeg-<version>-win-x64/. The static build
        # has no DLLs to bundle.
        env:
          WORK: ${{ runner.temp }}/ffmpeg-builds
          OUTDIR: ${{ runner.temp }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          src_zip="$(ls "$WORK"/artifacts/*win64-gpl*.zip | head -n1)"
          tmp="$(mktemp -d)"
          unzip -q "$src_zip" -d "$tmp"
          dest="ersatzrs-ffmpeg-${VERSION}-win-x64"
          rm -rf "${OUTDIR:?}/$dest" && mkdir -p "$OUTDIR/$dest"
          mkdir -p "$OUTDIR/$dest/build-info"
          tar -xf "$WORK/svg-sources.tar" -C "$OUTDIR/$dest/build-info"
          cp "$WORK/svg-image-id.txt" "$OUTDIR/$dest/build-info/"
          ( cd "$WORK/ersatzrs-patches" && sha256sum *.patch ) \
            > "$OUTDIR/$dest/build-info/patches.sha256"
          find "$tmp" -name ffmpeg.exe  -exec cp {} "$OUTDIR/$dest/" \;
          find "$tmp" -name ffprobe.exe -exec cp {} "$OUTDIR/$dest/" \;
          find "$tmp" -iname 'LICENSE*'  -exec cp {} "$OUTDIR/$dest/" \;
          test -f "$OUTDIR/$dest/ffmpeg.exe" && test -f "$OUTDIR/$dest/ffprobe.exe"
          # The Linux release runner has `unzip` but not `zip`; use python3
          # (present as /usr/bin/python3) to create the archive instead.
          ( cd "$OUTDIR"
            python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', root_dir='.', base_dir=sys.argv[1])" "$dest"
            sha256sum "${dest}.zip" > "${dest}.zip.sha256" )
          rm -rf "$tmp" "$OUTDIR/$dest"

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: ${{ runner.temp }}/ersatzrs-ffmpeg-*-win-x64.zip*
          if-no-files-found: error

  win-x64-verify:
    name: Verify win-x64 graphics contract
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'win-x64' }}
    needs: win-x64
    runs-on: [self-hosted, ersatzrs-windows-release]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download win-x64 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'win-x64-artifact'
          $downloaded = $false
          foreach ($attempt in 1..5) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $destination
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name win-x64 --dir $destination
            if ($LASTEXITCODE -eq 0) {
              $downloaded = $true
              break
            }
            Start-Sleep -Seconds ($attempt * 10)
          }
          if (-not $downloaded) { throw 'win-x64 artifact download failed after 5 attempts' }
          $archive = Get-ChildItem -Path $destination -Filter '*.zip' -Recurse | Select-Object -First 1
          if ($null -eq $archive) { throw 'win-x64 package archive is missing' }
          $expanded = Join-Path $destination 'expanded'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          "package_root=$expanded" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute drawtext package proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = Get-ChildItem -Path $env:package_root -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $env:package_root -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw 'packaged FFmpeg tools are missing' }
          $ffmpegVersion = & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg -version failed' }
          $ffmpegVersion | Select-Object -First 1
          $ffprobeVersion = & $ffprobe.FullName -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe -version failed' }
          $ffprobeVersion | Select-Object -First 1
          $filters = (& $ffmpeg.FullName -hide_banner -filters 2>&1) -join "`n"
          foreach ($filter in 'drawvg', 'drawtext') {
            if ($filters -notmatch "(?m)^.*\s$filter\s") { throw "missing required filter $filter" }
          }
          $buildconf = (& $ffmpeg.FullName -hide_banner -buildconf 2>&1) -join "`n"
          foreach ($flag in '--enable-librsvg', '--enable-cairo', '--enable-fontconfig', '--enable-libfreetype', '--enable-libharfbuzz', '--enable-libfribidi') {
            if (-not $buildconf.Contains($flag)) { throw "missing required build flag $flag" }
          }
          $proof = Join-Path $env:RUNNER_TEMP 'drawtext proof'
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          Set-Content -LiteralPath (Join-Path $proof 'text.txt') -Value 'ErsatzRS' -NoNewline -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $env:WINDIR 'Fonts\arial.ttf') -Destination (Join-Path $proof 'font.ttf')
          Push-Location $proof
          try {
            & $ffmpeg.FullName -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=64x64:d=0.1' -vf "drawtext=fontfile='font.ttf':textfile='text.txt':reload=1:fontsize=16:x=4:y=4,format=yuv420p" -frames:v 1 -f null -
            if ($LASTEXITCODE -ne 0) { throw 'file-backed drawtext render failed' }
          } finally {
            Pop-Location
          }

      - name: Execute decoded SVG package proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = Get-ChildItem -Path $env:package_root -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          python scripts/verify-svg.py $ffmpeg.FullName
          if ($LASTEXITCODE -ne 0) { throw 'decoded SVG verification failed' }

  release:
    name: Publish release
    # Only publish for an actual tag push; workflow_dispatch is build-only.
    if: ${{ github.event_name == 'push' }}
    needs: [linux-x64, win-x64, win-x64-verify]
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        # actions/download-artifact@v4 has failed on this self-hosted runner
        # ("Artifact download failed after 5 retries", v1.0.0). Use the gh CLI
        # instead — it pulls via the API (a different transport than the
        # artifact backend) and is the same tool the publish step already
        # relies on — wrapped in an explicit retry loop. gh places each
        # artifact in dist/<artifact-name>/.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf dist && mkdir -p dist
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist; then
              ok=1; break
            fi
            echo "download attempt ${attempt}/5 failed; retrying in $((attempt*10))s" >&2
            sleep $((attempt*10))
          done
          [ "$ok" = 1 ] || { echo "gh run download failed after 5 attempts" >&2; exit 1; }
          find dist -type f | sort

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "no artifact files downloaded" >&2; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "FFmpeg ${FFMPEG_VERSION} for ErsatzRS (drawvg/cairo, drawtext with shaping, libsvtav1, libjxl, zimg). RIDs: linux-x64, win-x64."
          fi
